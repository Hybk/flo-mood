<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flo Moods</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#09090B;
  --line:#E4E4E7;
  --flo:#2A211C;
  --flo-w:clamp(180px,38vh,320px);
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
/* double-taps are for spinning Flo, not zooming the page; pinch-zoom still works */
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  margin:0;
  background:#FFFFFF;
  color:var(--ink);
  font-family:Geist,-apple-system,"Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
.stage{
  box-sizing:border-box;
  min-height:100%;
  padding-inline:16px;
  padding-block:24px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:clamp(20px,4vh,40px);
  -webkit-user-select:none;user-select:none;
}

/* Flo */
.flo-wrap{position:relative;width:var(--flo-w);height:calc(var(--flo-w)*1.25);margin-top:clamp(44px,7vh,72px)}
.layer{position:absolute;inset:0}
.flo-btn{display:block;width:100%;height:100%;padding:0;border:0;background:none;cursor:pointer;border-radius:24px;-webkit-tap-highlight-color:transparent;touch-action:none}
.idle,.react{display:block;width:100%;height:100%;transform-origin:50% 93%}
.flo-svg,.shadow-svg{display:block;width:100%;height:100%;overflow:visible}

.k{stroke:var(--flo);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.k2{stroke:var(--flo);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nf{fill:none}.fi{fill:var(--flo)}.fw{fill:#FFFFFF}.fc{fill:#F6EBDA}
.cheek{fill:#FF8FA3;opacity:.7}
.drop{fill:#8CCBF5}
.zz{font-family:Geist,sans-serif;font-weight:700;fill:var(--flo)}

.i-float{animation:float 3.2s ease-in-out infinite}
.i-shake{animation:shake .5s linear infinite}
.i-breathe{animation:breathe 3.6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.4%)}}
@keyframes shake{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-1.1%) rotate(-1.5deg)}75%{transform:translateX(1.1%) rotate(1.5deg)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.03,.98)}}

#shadowE{transform-box:fill-box;transform-origin:center}
.s-float #shadowE{animation:sfloat 3.2s ease-in-out infinite}
.s-breathe #shadowE{animation:sbreathe 3.6s ease-in-out infinite}
@keyframes sfloat{50%{transform:scale(.9,1)}}
@keyframes sbreathe{50%{transform:scale(1.04,1)}}

.puff{animation:puff 1.4s ease-in-out infinite alternate}
.puff.b{animation-delay:-.7s}
@keyframes puff{to{transform:translateY(-2.5px)}}
.drip{animation:drip 1.8s ease-in-out infinite}
@keyframes drip{50%{transform:translateY(2.5px)}}
.zloop{animation:zz 2.4s ease-in-out infinite}
@keyframes zz{50%{transform:translate(1.5px,-3px);opacity:.65}}

/* speech bubble */
.bubble{position:absolute;left:50%;top:0;z-index:3;transform:translate(-50%,calc(-100% - 10px));pointer-events:none}
.bubble-in{
  position:relative;
  display:block;
  max-width:min(320px,80vw);
  padding:10px 15px;
  border-radius:12px;
  background:#18181B;color:#FAFAFA;
  font-size:16px;font-weight:500;line-height:1.35;letter-spacing:-.005em;
  text-align:center;white-space:nowrap;
  box-shadow:0 10px 24px -8px rgba(0,0,0,.3);
  transform-origin:50% 100%;
}
.bubble-in::after{content:"";position:absolute;left:50%;bottom:-5px;width:11px;height:11px;border-radius:2px;background:#18181B;transform:translateX(-50%) rotate(45deg)}

/* ‹ mood › */
.switcher{display:flex;align-items:center;gap:8px}
.nav{
  flex-shrink:0;
  width:40px;height:40px;padding:0;
  display:grid;place-items:center;
  border:1px solid var(--line);border-radius:50%;
  background:#FFFFFF;color:var(--ink);
  cursor:pointer;
  transition:background-color .15s,transform .12s ease;
  -webkit-tap-highlight-color:transparent;
}
.nav:hover{background:#F4F4F5}
.nav:active{transform:scale(.92)}
.nav svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav:focus-visible,.flo-btn:focus-visible{outline:3px solid rgba(9,9,11,.25);outline-offset:3px}
.mood{
  width:176px;
  display:grid;
  overflow:hidden;
  font-size:22px;font-weight:600;letter-spacing:-.02em;line-height:1.3;
  color:var(--ink);
}
.mood>span{grid-area:1/1;justify-self:center;white-space:nowrap}
.hint{margin:0;max-width:300px;font-size:13px;line-height:1.5;color:#71717A;text-align:center;text-wrap:balance}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:560px){
  :root{--flo-w:clamp(160px,52vw,240px)}
  .bubble-in{white-space:normal;font-size:15px}
}
@media (prefers-reduced-motion:reduce){
  .i-float,.i-shake,.i-breathe,.puff,.drip,.zloop,.s-float #shadowE,.s-breathe #shadowE{animation:none}
}
</style>

<main class="stage">
  <div class="flo-wrap">
    <div class="bubble" id="bubble" hidden><span class="bubble-in" id="bubbleIn" role="status"></span></div>
    <svg class="layer shadow-svg" id="shadowSvg" viewBox="0 -30 120 150" aria-hidden="true"><ellipse id="shadowE" cx="60" cy="114" rx="40" ry="4.5" fill="#2A211C" fill-opacity=".13"></ellipse></svg>
    <button class="flo-btn layer" id="flo" type="button" aria-label="Poke Flo">
      <span class="idle" id="idle"><span class="react" id="react">
        <svg class="flo-svg" viewBox="0 -30 120 150" aria-hidden="true" focusable="false">
          <g id="s1"><g class="puff"><circle cx="16" cy="28" r="5" class="k2 fw"></circle></g></g>
          <g id="s2"><g class="puff b"><circle cx="8" cy="16" r="3.5" class="k2 fw"></circle></g></g>
          <g id="s3"><g class="puff b"><circle cx="104" cy="28" r="5" class="k2 fw"></circle></g></g>
          <g id="s4"><g class="puff"><circle cx="112" cy="16" r="3.5" class="k2 fw"></circle></g></g>
          <path id="body" class="k" fill="#3DBE6E" d="M14 110 C24 110 28 104 28 94 L28 44 C28 29 39 20 54 20 L66 20 C81 20 92 29 92 44 L92 94 C92 104 96 110 106 110 Z"></path>
          <ellipse cx="41" cy="36" rx="7" ry="4" transform="rotate(-25 41 36)" fill="#FFFFFF" fill-opacity=".45"></ellipse>
          <g id="face">
            <g data-f="cheeks"><ellipse cx="39" cy="71" rx="5.5" ry="3.2" class="cheek"></ellipse><ellipse cx="81" cy="71" rx="5.5" ry="3.2" class="cheek"></ellipse></g>
            <g data-f="eOpen"><circle cx="48" cy="58" r="5" class="fi"></circle><circle cx="72" cy="58" r="5" class="fi"></circle><circle cx="49.8" cy="56.2" r="1.7" class="fw"></circle><circle cx="73.8" cy="56.2" r="1.7" class="fw"></circle></g>
            <g data-f="brows"><path d="M41 49 L53 45" class="k nf"></path><path d="M79 49 L67 45" class="k nf"></path></g>
            <g data-f="eHappy"><path d="M42 60 Q48 51 54 60" class="k nf"></path><path d="M66 60 Q72 51 78 60" class="k nf"></path></g>
            <g data-f="eDizzy"><path d="M43 53 L53 63 M53 53 L43 63" class="k nf"></path><path d="M67 53 L77 63 M77 53 L67 63" class="k nf"></path></g>
            <g data-f="eClosed"><path d="M42 58 Q48 64 54 58" class="k nf"></path><path d="M66 58 Q72 64 78 58" class="k nf"></path></g>
            <g data-f="eFlat"><path d="M43 59 L53 59" class="k nf"></path><path d="M67 59 L77 59" class="k nf"></path></g>
            <path data-f="mBig" d="M48 71 Q60 88 72 71 Z" class="k fi"></path>
            <path data-f="mSmile" d="M51 73 Q60 81 69 73" class="k nf"></path>
            <path data-f="mFlat" d="M52 76 L68 76" class="k nf"></path>
            <path data-f="mWobble" d="M49 77 Q54.5 72 60 77 Q65.5 82 71 77" class="k nf"></path>
            <path data-f="mOpen" d="M50 83 Q60 67 70 83 Z" class="k fi"></path>
            <circle data-f="mO" cx="60" cy="77" r="3.5" class="k2 nf"></circle>
          </g>
          <g id="sweat"><g class="drip"><path d="M99 36 C99 36 93 45 93 49 A6 6 0 0 0 105 49 C105 45 99 36 99 36 Z" class="k2 drop"></path></g></g>
          <g id="p1"><path transform="translate(43 8) rotate(-6 17 6)" d="M0 12 C4 12 5 10 5 7 L5 3 C5 1 6 0 8 0 L26 0 C28 0 29 1 29 3 L29 7 C29 10 30 12 34 12 Z" class="k2 fw"></path></g>
          <g id="p2"><path transform="translate(39 -3) rotate(8 17 6)" d="M0 12 C4 12 5 10 5 7 L5 3 C5 1 6 0 8 0 L26 0 C28 0 29 1 29 3 L29 7 C29 10 30 12 34 12 Z" class="k2 fc"></path></g>
          <g id="p3"><path transform="translate(46 -14) rotate(-10 17 6)" d="M0 12 C4 12 5 10 5 7 L5 3 C5 1 6 0 8 0 L26 0 C28 0 29 1 29 3 L29 7 C29 10 30 12 34 12 Z" class="k2 fw"></path></g>
          <g id="p4"><path transform="translate(40 -25) rotate(5 17 6)" d="M0 12 C4 12 5 10 5 7 L5 3 C5 1 6 0 8 0 L26 0 C28 0 29 1 29 3 L29 7 C29 10 30 12 34 12 Z" class="k2 fc"></path></g>
          <g id="zzz"><g class="zloop"><text x="94" y="14" font-size="14" class="zz">z</text><text x="103" y="-2" font-size="19" class="zz">Z</text></g></g>
        </svg>
      </span></span>
    </button>
  </div>

  <div class="switcher">
    <button class="nav" id="prev" type="button" aria-label="Previous mood">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
    </button>
    <div class="mood" id="mood"></div>
    <button class="nav" id="next" type="button" aria-label="Next mood">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
    </button>
  </div>
  <p class="hint">Tap Flo to poke. Double-tap to spin. Flick the tabs off its head.</p>
  <div class="sr" id="live" aria-live="polite"></div>
</main>

<script>
(function () {
  var MOODS = [
    { name: 'Breezy', fill: '#3DBE6E', eyes: 'happy', mouth: 'big', cheeks: 1, pile: 0, idle: 'float', quips: ['Ahh. Room to breathe.', 'Clean slate. Love it.', 'So much space up here.', 'Is it always this quiet?', 'Nothing on my head. Bliss.'] },
    { name: 'Comfy', fill: '#A3CF3F', eyes: 'open', mouth: 'smile', cheeks: 1, pile: 1, idle: 'float', quips: ['Feeling light. Nice work.', 'One tab. I can carry that.', 'This is my happy weight.', 'Cozy, not crowded.', 'One hat. Very stylish.'] },
    { name: 'Busy', fill: '#F4C534', eyes: 'open', mouth: 'flat', pile: 2, idle: 'none', quips: ['Getting a little busy in here…', 'Two tabs. I’m watching them.', 'Still fine. Mostly fine.', 'Do we need both of these?', 'Balancing act in progress.'] },
    { name: 'Crowded', fill: '#F48A2A', eyes: 'worried', mouth: 'wobble', sweat: 1, pile: 3, idle: 'none', quips: ['It’s getting crowded. Tidy up?', 'My head is a filing cabinet now.', 'Three tabs. I’m sweating.', 'Close something. Anything.', 'Wobbling a bit up here…'] },
    { name: 'Overloaded', fill: '#E5483B', eyes: 'dizzy', mouth: 'open', sweat: 1, steam: 1, pile: 4, idle: 'shake', quips: ['Too… many… tabs!', 'I can’t see over the pile!', 'Is all of this research?', 'Mayday! Mayday!', 'Flick a few off, please!'] },
    { name: 'Napping', fill: '#E5483B', eyes: 'closed', mouth: 'o', zzz: 1, pile: 4, idle: 'breathe', quips: ['Zzz… wake me when you’re ready.', 'Five more minutes…', 'Mmf. Tabs later.', 'Dreaming of an empty browser…', 'Shh. Recharging.'] },
    { name: 'Off duty', fill: '#BDB6AC', eyes: 'flat', mouth: 'flat', pile: 0, idle: 'none', quips: ['I’m off duty. Flip the switch.', 'Clocked out. See you tomorrow.', 'Not now. On break.', 'Gone fishing.', 'Out of office.'] }
  ];
  var SPIN_LINES = ['Wheee!', 'Again! Again!', 'Whoa. Head rush.', 'Did you see that?', 'Nailed the landing.'];
  var FLICK_LINES = ['Phew, thanks.', 'Lighter already.', 'Bye, tab!', 'One down.', 'Much better.'];
  var lastLine = '';
  function pickLine(list) {
    var opts = list.filter(function (l) { return l !== lastLine; });
    lastLine = opts[Math.floor(Math.random() * opts.length)];
    return lastLine;
  }
  var $ = function (id) { return document.getElementById(id); };
  var RM = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var E = {
    lin: function (t) { return t; },
    inQuad: function (t) { return t * t; },
    outCubic: function (t) { return 1 - Math.pow(1 - t, 3); },
    inOutCubic: function (t) { return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; },
    outBack: function (t) { var s = 1.9; return 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2); },
    outBounce: function (t) {

      if (t < 1 / d) return n * t * t;
      if (t < 2 / d) { t -= 1.5 / d; return n * t * t + .75; }
      if (t < 2.5 / d) { t -= 2.25 / d; return n * t * t + .9375; }
      t -= 2.625 / d; return n * t * t + .984375;
    }
  };

  // An SVG group we can move, scale, rotate and fade around its own pivot.
  function Part(el, ox, oy, op, s) {
    this.el = el; this.ox = ox; this.oy = oy; this.tw = {};
    this.v = { tx: 0, ty: 0, s: s == null ? 1 : s, sy: 1, rot: 0, op: op == null ? 1 : op };
    this.render();
  }
  Part.prototype.render = function () {
    var v = this.v, sx = Math.max(v.s, .001), sy = Math.max(v.s * v.sy, .001);
    this.el.setAttribute('transform', 'translate(' + (v.tx + this.ox).toFixed(2) + ' ' + (v.ty + this.oy).toFixed(2) + ') rotate(' + v.rot.toFixed(2) + ') scale(' + sx.toFixed(3) + ' ' + sy.toFixed(3) + ') translate(' + (-this.ox) + ' ' + (-this.oy) + ')');
    this.el.setAttribute('opacity', Math.max(0, Math.min(1, v.op)).toFixed(3));
  };

  var tweens = [];
  var parts = [];
  // kfs: [[to, duration, ease], ...] played back to back after `delay`
  function tween(p, prop, kfs, delay, from) {
    var old = p.tw[prop];
    if (old) old.dead = true;
    var t = { p: p, prop: prop, kfs: kfs.map(function (k) { return [k[0], RM ? 1 : k[1], k[2] || E.outCubic]; }), start: performance.now() + (RM ? 0 : (delay || 0)), from: from == null ? null : from, began: false };

  }
  function setNow(p, props) {
    for (var k in props) { if (p.tw[k]) { p.tw[k].dead = true; delete p.tw[k]; } p.v[k] = props[k]; }
    p.render();
  }

  var bodyEl = $('body');
  var bodyCol = hex(MOODS[0].fill), colT = null;
  function hex(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
  function colorTo(h, delay, dur) { colT = { to: hex(h), start: performance.now() + (RM ? 0 : delay), dur: RM ? 1 : dur, from: null }; }

  function frame(now) {
    for (var i = tweens.length - 1; i >= 0; i--) {
      var t = tweens[i];

      if (now < t.start) continue;
      var p = t.p;
      if (!t.began) { t.began = true; if (t.from != null) p.v[t.prop] = t.from; t.f0 = p.v[t.prop]; }

      for (var j = 0; j < t.kfs.length; j++) {
        var k = t.kfs[j];

      p.v[t.prop] = val; p.dirty = true;
      if (done) { tweens.splice(i, 1); if (p.tw[t.prop] === t) delete p.tw[t.prop]; }

    for (var n = 0; n < parts.length; n++) if (parts[n].dirty) { parts[n].render(); parts[n].dirty = false; }
    if (colT && now >= colT.start) {

      var q = Math.min(1, (now - colT.start) / colT.dur), e = E.inOutCubic(q);
      bodyCol = colT.from.map(function (c, idx) { return c + (colT.to[idx] - c) * e; });
      bodyEl.setAttribute('fill', 'rgb(' + bodyCol.map(Math.round).join(',') + ')');
      if (q >= 1) colT = null;

  }

  function add(p) { parts.push(p); return p; }
  var face = add(new Part($('face'), 60, 66));
  var pile = [['p1', 60, 14], ['p2', 56, 3], ['p3', 63, -8], ['p4', 57, -19]].map(function (d) { return add(new Part($(d[0]), d[1], d[2], 0)); });
  var puffs = [['s1', 16, 28], ['s2', 8, 16], ['s3', 104, 28], ['s4', 112, 16]].map(function (d) { return add(new Part($(d[0]), d[1], d[2], 0, 0)); });
  var sweat = add(new Part($('sweat'), 99, 42, 0));
  var zzz = add(new Part($('zzz'), 104, 4, 0));
  var featEls = Array.prototype.slice.call(document.querySelectorAll('[data-f]'));
  var pupils = document.querySelector('[data-f="eOpen"]');

  // where Flo is looking: -1..1 on each axis
  var look = { x: 0, y: 0 }, lookTarget = { x: 0, y: 0 }, wander = { x: 0, y: 0 };
  var lastPointer = -1e9, lastInteract = 0, faceOverride = false;
  function aimAt(cx, cy) {
    var r = $('flo').getBoundingClientRect();
    var dx = cx - (r.left + r.width * .5), dy = cy - (r.top + r.height * (92 / 150));
    var len = Math.hypot(dx, dy) || 1, f = Math.min(1, len / (r.width * .9));
    lookTarget.x = dx / len * f; lookTarget.y = dy / len * f * .9;
  }
  function updateLook(now) {
    var e = MOODS[cur].eyes;
    var ignoring = !faceOverride && (e === 'closed' || e === 'flat');
    var tgt = ignoring ? { x: 0, y: 0 } : now - lastPointer < 3000 ? lookTarget : wander;
    var nx = look.x + (tgt.x - look.x) * .14, ny = look.y + (tgt.y - look.y) * .14;
    if (Math.abs(nx - look.x) < .001 && Math.abs(ny - look.y) < .001) return;
    look.x = nx; look.y = ny;
    face.v.tx = look.x * 3.2; face.v.ty = look.y * 2.2; face.dirty = true;
    pupils.setAttribute('transform', 'translate(' + (look.x * 1.6).toFixed(2) + ' ' + (look.y * 1.3).toFixed(2) + ')');
  }

  function features(m) {
    return {
      cheeks: !!m.cheeks, eOpen: m.eyes === 'open' || m.eyes === 'worried', brows: m.eyes === 'worried',
      eHappy: m.eyes === 'happy', eDizzy: m.eyes === 'dizzy', eClosed: m.eyes === 'closed', eFlat: m.eyes === 'flat',
      mBig: m.mouth === 'big', mSmile: m.mouth === 'smile', mFlat: m.mouth === 'flat', mWobble: m.mouth === 'wobble', mOpen: m.mouth === 'open', mO: m.mouth === 'o'
    };
  }
  function setFace(m) {
    var f = features(m);
    featEls.forEach(function (el) { el.setAttribute('opacity', f[el.getAttribute('data-f')] ? 1 : 0); });
  }

  // tab pile
  var pileOn = [false, false, false, false];
  function pileIn(i, delay) {
    var side = i % 2 ? 1 : -1;
    setNow(pile[i], { tx: 0 });
    tween(pile[i], 'ty', [[0, 560, E.outBounce]], delay, -58);
    tween(pile[i], 'op', [[1, 140, E.lin]], delay, 0);
    tween(pile[i], 'rot', [[0, 520, E.outBack]], delay, 16 * side);
  }
  function pileOut(i, delay) {
    var side = i % 2 ? 1 : -1;
    tween(pile[i], 'ty', [[-38, 360, E.outCubic]], delay);
    tween(pile[i], 'tx', [[20 * side, 360, E.outCubic]], delay);
    tween(pile[i], 'rot', [[28 * side, 360, E.outCubic]], delay);
    tween(pile[i], 'op', [[0, 300, E.inQuad]], delay);
  }
  function pileTo(n, animate) {
    var k = 0, i;
    for (i = 3; i >= 0; i--) if (i >= n && pileOn[i]) { pileOn[i] = false; animate ? pileOut(i, k++ * 70) : setNow(pile[i], { op: 0 }); }
    k = 0;
    for (i = 0; i < 4; i++) if (i < n && !pileOn[i]) { pileOn[i] = true; animate ? pileIn(i, 190 + k++ * 110) : setNow(pile[i], { op: 1, ty: 0, tx: 0, rot: 0 }); }
  }

  // sweat, steam, zzz
  var extras = { sweat: false, steam: false, zzz: false };
  function extrasTo(m, animate) {
    if (!!m.sweat !== extras.sweat) {
      extras.sweat = !!m.sweat;
      if (!animate) setNow(sweat, { op: extras.sweat ? 1 : 0, s: 1, ty: 0 });
      else if (extras.sweat) { tween(sweat, 's', [[1, 440, E.outBack]], 260, .2); tween(sweat, 'op', [[1, 160, E.lin]], 260, 0); tween(sweat, 'ty', [[0, 440, E.outCubic]], 260, -6); }
      else { tween(sweat, 'op', [[0, 200, E.lin]]); tween(sweat, 'ty', [[7, 260, E.inQuad]]); }
    }
    if (!!m.steam !== extras.steam) {
      extras.steam = !!m.steam;
      puffs.forEach(function (p, i) {
        if (!animate) setNow(p, { op: extras.steam ? 1 : 0, s: extras.steam ? 1 : 0 });
        else if (extras.steam) { tween(p, 's', [[1, 400, E.outBack]], 220 + i * 60, 0); tween(p, 'op', [[1, 120, E.lin]], 220 + i * 60, 0); }
        else { tween(p, 's', [[0, 220, E.inQuad]], i * 30); tween(p, 'op', [[0, 200, E.lin]], i * 30); }
      });
    }
    if (!!m.zzz !== extras.zzz) {
      extras.zzz = !!m.zzz;
      if (!animate) setNow(zzz, { op: extras.zzz ? 1 : 0, ty: 0 });
      else if (extras.zzz) { tween(zzz, 'op', [[1, 320, E.lin]], 340, 0); tween(zzz, 'ty', [[0, 520, E.outCubic]], 340, 10); }
      else { tween(zzz, 'op', [[0, 200, E.lin]]); tween(zzz, 'ty', [[-9, 260, E.outCubic]]); }
    }
  }

  // whole-body reactions (HTML wrappers, so the shadow stays on the floor)
  var reactEl = $('react'), idleEl = $('idle'), shadowSvg = $('shadowSvg'), shadowE = $('shadowE');
  var ez = 'cubic-bezier(.45,0,.25,1)';
  var BODY = {
    morph: [['none', 0], ['scale(1.08,.9)', .18], ['translateY(-3.5%) scale(.95,1.07)', .46], ['translateY(0) scale(1.03,.97)', .72], ['none', 1]],
    jump: [['none', 0], ['scale(1.15,.85)', .2], ['translateY(-9%) scale(.92,1.1)', .5], ['translateY(0) scale(1.08,.92)', .8], ['none', 1]],
    poke: [['none', 0], ['scale(1.14,.86)', .3], ['scale(.93,1.08)', .6], ['none', 1]],
    // every frame uses the same function list so rotateY interpolates through two full turns
    spin: [
      ['perspective(600px) translateY(0%) rotateY(0deg) scale(1,1)', 0],
      ['perspective(600px) translateY(0%) rotateY(0deg) scale(1.12,.88)', .14],
      ['perspective(600px) translateY(-12%) rotateY(360deg) scale(.94,1.08)', .5],
      ['perspective(600px) translateY(0%) rotateY(720deg) scale(1.1,.9)', .82],
      ['perspective(600px) translateY(0%) rotateY(720deg) scale(1,1)', 1]
    ],
    wiggle: [['rotate(0deg)', 0], ['rotate(-4deg)', .25], ['rotate(3deg)', .55], ['rotate(-1.5deg)', .8], ['rotate(0deg)', 1]]
  };
  var SHADOW = { morph: [1, 1.07, .86, 1.02, 1], jump: [1, 1.12, .68, 1.06, 1], poke: [1, 1.12, .95, 1], spin: [1, 1.12, .62, 1.08, 1], wiggle: [1, .97, 1.02, .99, 1] };
  var DUR = { morph: 640, jump: 800, poke: 550, spin: 1000, wiggle: 700 };
  var bodyAnim = null, shadowAnim = null;
  function react(kind) {
    if (RM) return;
    if (bodyAnim) bodyAnim.cancel();
    if (shadowAnim) shadowAnim.cancel();
    bodyAnim = reactEl.animate(BODY[kind].map(function (f) { return { transform: f[0], offset: f[1], easing: ez }; }), { duration: DUR[kind] });
    shadowAnim = shadowE.animate(SHADOW[kind].map(function (s, i) { return { transform: 'scale(' + s + ',1)', offset: BODY[kind][i][1], easing: ez }; }), { duration: DUR[kind] });
  }
  function setIdle(m) {
    idleEl.className = 'idle' + (m && m.idle !== 'none' ? ' i-' + m.idle : '');
    shadowSvg.setAttribute('class', 'layer shadow-svg' + (m && m.idle !== 'none' ? ' s-' + m.idle : ''));
  }

  // mood name between the arrows
  var moodEl = $('mood'), live = $('live');
  function roll(text, dir) {
    var olds = Array.prototype.slice.call(moodEl.children);
    var n = document.createElement('span'); n.textContent = text; moodEl.appendChild(n);
    if (RM || dir === 0) { olds.forEach(function (o) { o.remove(); }); return; }
    var d = 22 * dir;
    olds.forEach(function (o) {
      var a = o.animate([{ opacity: 1, transform: 'translateX(0)' }, { opacity: 0, transform: 'translateX(' + (-d) + 'px)' }], { duration: 220, easing: 'cubic-bezier(.4,0,1,1)', fill: 'forwards' });
      a.onfinish = function () { o.remove(); };
    });
    n.animate([{ opacity: 0, transform: 'translateX(' + d + 'px)' }, { opacity: 1, transform: 'translateX(0)' }], { duration: 420, delay: 80, easing: 'cubic-bezier(.2,.9,.3,1)', fill: 'backwards' });
  }

  // speech bubble
  var bubble = $('bubble'), bubbleIn = $('bubbleIn'), bubbleTimer = 0, hideAnim = null;
  var HEAD_TOP = [20, 5, -5, -16, -27];
  function showBubble(text) {
    var m = MOODS[cur];
    if (hideAnim) { hideAnim.cancel(); hideAnim = null; }
    bubble.style.top = ((HEAD_TOP[m.pile] + 30) / 150 * 100) + '%';
    bubbleIn.textContent = text;
    bubble.hidden = false;
    if (!RM) bubbleIn.animate([{ opacity: 0, transform: 'translateY(6px) scale(.9)' }, { opacity: 1, transform: 'none' }], { duration: 240, easing: 'cubic-bezier(.3,1.5,.5,1)' });
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(hideBubble, 2400);
  }
  function hideBubble() {
    clearTimeout(bubbleTimer);
    if (bubble.hidden) return;
    if (RM) { bubble.hidden = true; return; }
    hideAnim = bubbleIn.animate([{ opacity: 1 }, { opacity: 0, transform: 'translateY(-4px)' }], { duration: 160, easing: 'ease-in', fill: 'forwards' });
    hideAnim.onfinish = function () { bubble.hidden = true; if (hideAnim) hideAnim.cancel(); hideAnim = null; };
  }

  // mood changes
  var cur = 0, tid = 0;
  function later(ms, fn) { var my = tid; setTimeout(function () { if (my === tid) fn(); }, RM ? 0 : ms); }

  function go(idx, dir) {
    var to = MOODS[idx];
    cur = idx; tid++; spinTok++; faceOverride = false;
    hideBubble();
    live.textContent = 'Flo feels ' + to.name + '.';

    setIdle(null);
    react('morph');
    colorTo(to.fill, 80, 440);
    tween(face, 'sy', [[.06, 120, E.inQuad], [1, 300, E.outBack]], 30);
    later(150, function () { setFace(to); });
    pileTo(to.pile, true);
    extrasTo(to, true);
    later(680, function () { setIdle(to); });
    roll(to.name, dir);
  }
  function step(d) { go((cur + d + MOODS.length) % MOODS.length, d); }

  // poke
  var pokeTok = 0;
  function poke() {
    var m = MOODS[cur], myTid = tid, my = ++pokeTok;
    showBubble(pickLine(m.quips));
    react(m.idle === 'shake' ? 'poke' : 'jump');
    var still = function () { return tid === myTid && pokeTok === my; };
    if (m.eyes === 'closed') {
      // a nap gets interrupted: eyes pop open, then drift shut again
      tween(face, 'sy', [[.08, 90, E.inQuad], [1, 240, E.outBack]]);
      setTimeout(function () { if (still()) setFace({ eyes: 'open', mouth: 'o' }); }, RM ? 0 : 90);
      setTimeout(function () {
        if (!still()) return;
        tween(face, 'sy', [[.08, 110, E.inQuad], [1, 260, E.outBack]]);
        setTimeout(function () { if (still()) setFace(m); }, RM ? 0 : 110);
      }, RM ? 0 : 1400);
    } else if (m.eyes !== 'flat') {
      tween(face, 'sy', [[.1, 80, E.inQuad], [1, 220, E.outBack]], 140);
    }
    var k = 0;
    for (var i = 0; i < 4; i++) {
      if (!pileOn[i]) continue;
      var side = i % 2 ? -1 : 1;
      tween(pile[i], 'rot', [[9 * side, 110, E.outCubic], [-6 * side, 150, E.inOutCubic], [0, 240, E.outBack]], 80 + k++ * 55);
    }
  }

  // spin: two turns on the spot, then a moment of dizzy eyes
  var spinTok = 0;
  function spin(text) {
    var myTid = tid, my = ++spinTok;
    var still = function () { return tid === myTid && spinTok === my; };
    showBubble(text || pickLine(SPIN_LINES));
    if (RM) return;
    react('spin');
    setTimeout(function () {
      if (!still()) return;
      faceOverride = true;
      tween(face, 'sy', [[.1, 80, E.inQuad], [1, 220, E.outBack]]);
      setFace({ eyes: 'dizzy', mouth: MOODS[cur].mouth === 'big' ? 'big' : 'wobble', cheeks: MOODS[cur].cheeks });
    }, 820);
    setTimeout(function () {
      if (!still()) return;
      faceOverride = false;
      tween(face, 'sy', [[.1, 80, E.inQuad], [1, 220, E.outBack]]);
      setTimeout(function () { if (still()) setFace(MOODS[cur]); }, 80);
    }, 1800);
  }

  // flicking tabs off the pile
  function topTab() { for (var i = 3; i >= 0; i--) if (pileOn[i]) return i; return -1; }
  function toUnits(e) {
    var r = $('flo').getBoundingClientRect();
    return { x: (e.clientX - r.left) / r.width * 120, y: (e.clientY - r.top) / r.height * 150 - 30 };
  }
  function inPileZone(u) { return topTab() >= 0 && u.y < 22 && u.x > 26 && u.x < 94; }
  function fling(i, vx, vy) {
    var p = pile[i], v = p.v;
    var dir = Math.abs(vx) > .05 ? Math.sign(vx) : (v.tx >= 0 ? 1 : -1);
    var sp = Math.min(1.6, Math.max(.7, Math.hypot(vx, vy) / .6));
    pileOn[i] = false;
    tween(p, 'tx', [[v.tx + dir * 130 * sp, 650, E.outCubic]]);
    tween(p, 'ty', [[v.ty - 30 * sp + Math.min(0, vy * 150), 240, E.outCubic], [v.ty + 110, 460, E.inQuad]]);
    tween(p, 'rot', [[v.rot + dir * 260, 700, E.outCubic]]);
    tween(p, 'op', [[1, 420, E.lin], [0, 260, E.lin]]);
    // the pile now has i tabs, and moods 0–3 hold 0–3 tabs
    go(i, -1);
    if (i === 0) later(720, function () { spin('All clear. Wheee!'); });
    else later(520, function () { showBubble(pickLine(FLICK_LINES)); });
  }

  var flo = $('flo'), drag = null, dragMoved = false;
  flo.addEventListener('pointerdown', function (e) {
    if (e.button !== 0) return;
    var u = toUnits(e);
    if (!inPileZone(u)) return;
    drag = { i: topTab(), x0: u.x, y0: u.y, id: e.pointerId, moved: false, samples: [{ x: u.x, y: u.y, t: e.timeStamp }] };
    flo.setPointerCapture(e.pointerId);
  });
  flo.addEventListener('pointermove', function (e) {
    var u = toUnits(e);
    if (!drag) { flo.style.cursor = inPileZone(u) ? 'grab' : ''; return; }
    if (e.pointerId !== drag.id || !pileOn[drag.i]) return;
    var dx = u.x - drag.x0, dy = u.y - drag.y0;
    if (!drag.moved && Math.hypot(dx, dy) < 3) return;
    drag.moved = true;
    flo.style.cursor = 'grabbing';
    setNow(pile[drag.i], { tx: dx, ty: dy, rot: Math.max(-30, Math.min(30, dx * .8)), op: 1 });
    drag.samples.push({ x: u.x, y: u.y, t: e.timeStamp });
    while (drag.samples.length > 2 && e.timeStamp - drag.samples[0].t > 90) drag.samples.shift();
  });
  function endDrag(e) {
    if (!drag || e.pointerId !== drag.id) return;
    var d = drag; drag = null;
    flo.style.cursor = '';
    if (!d.moved) return;
    dragMoved = true;
    setTimeout(function () { dragMoved = false; }, 0);
    if (!pileOn[d.i]) return;
    var a = d.samples[0], b = d.samples[d.samples.length - 1], dt = Math.max(1, b.t - a.t);
    var vx = (b.x - a.x) / dt, vy = (b.y - a.y) / dt, p = pile[d.i];
    if (Math.hypot(p.v.tx, p.v.ty) > 20 || Math.hypot(vx, vy) > .35) fling(d.i, vx, vy);
    else {
      tween(p, 'tx', [[0, 380, E.outBack]]);
      tween(p, 'ty', [[0, 380, E.outBack]]);
      tween(p, 'rot', [[0, 380, E.outBack]]);
    }
  }
  flo.addEventListener('pointerup', endDrag);
  flo.addEventListener('pointercancel', endDrag);

  // one tap pokes, a quick second tap spins
  var lastTap = 0;
  flo.addEventListener('click', function () {
    if (dragMoved) return;
    var now = performance.now();
    if (now - lastTap < 320) { lastTap = 0; spin(); }
    else { lastTap = now; poke(); }
  });

  // eyes follow the pointer
  function noteInteract() { lastInteract = performance.now(); }
  window.addEventListener('pointermove', function (e) { lastPointer = performance.now(); noteInteract(); aimAt(e.clientX, e.clientY); });
  window.addEventListener('pointerdown', function (e) { lastPointer = performance.now(); noteInteract(); aimAt(e.clientX, e.clientY); });
  document.documentElement.addEventListener('mouseleave', function () { lastPointer = -1e9; });

  // idle life: blinks, glances, wiggles
  function blinkOnce() { tween(face, 'sy', [[.1, 70, E.inQuad], [1, 170, E.outCubic]]); }
  function blink() {
    setTimeout(blink, 2600 + Math.random() * 3800);
    if (RM || document.hidden || faceOverride || face.tw.sy) return;
    var e = MOODS[cur].eyes;
    if (e !== 'open' && e !== 'happy' && e !== 'worried') return;
    blinkOnce();
    if (Math.random() < .2) setTimeout(function () { if (!face.tw.sy && !faceOverride) blinkOnce(); }, 320);
  }
  function glance(points) {
    points.forEach(function (pt, i) { setTimeout(function () { wander.x = pt[0]; wander.y = pt[1]; }, i * 700); });
  }
  function fidget() {
    setTimeout(fidget, 5000 + Math.random() * 6000);
    var m = MOODS[cur];
    if (RM || document.hidden || performance.now() - lastInteract < 4000 || faceOverride) return;
    if (m.idle === 'shake' || m.eyes === 'closed' || m.eyes === 'flat') return;
    if (bodyAnim && bodyAnim.playState === 'running') return;
    var r = Math.random();
    if (r < .4) glance([[-.8, .1], [.8, .1], [0, 0]]);
    else if (r < .7 && topTab() >= 0) glance([[0, -1], [0, -1], [0, 0]]);
    else react('wiggle');
  }

  // wire up
  $('prev').addEventListener('click', function () { step(-1); });
  $('next').addEventListener('click', function () { step(1); });
  window.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    noteInteract();
    var onButton = document.activeElement && document.activeElement.tagName === 'BUTTON';
    if (e.key === 'ArrowRight') { e.preventDefault(); step(1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1); }
    else if (e.key === ' ' && !onButton) { e.preventDefault(); poke(); }
    else if (e.key === 's' || e.key === 'S') spin();
    else if (/^[1-7]$/.test(e.key)) { var i = +e.key - 1; if (i !== cur) go(i, i > cur ? 1 : -1); }
  });
  setTimeout(blink, 2000);
  setTimeout(fidget, 6000);

  // first frame: Breezy, at rest
  var m0 = MOODS[0];
  setFace(m0); pileTo(m0.pile, false); extrasTo(m0, false); setIdle(m0);
  roll(m0.name, 0);
  requestAnimationFrame(frame);
})();
</script>
